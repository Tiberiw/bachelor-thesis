# Local dev database. Credentials come from back-end/.env (dev.ps1 passes --env-file).
# Host port 5433 avoids clashing with a locally installed Postgres on 5432,
# so set DB_PORT=5433 in back-end/.env.
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in back-end/.env}
      POSTGRES_DB: ${DB_DATABASE:-thesis}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
