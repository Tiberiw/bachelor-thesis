<div class="min-h-screen bg-gradient-to-br from-medical-blue-light to-blue-50 flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
  <div class="max-w-md w-full space-y-8">
    <!-- Header -->
    <div class="text-center">
      <div class="mx-auto h-16 w-16 bg-medical-blue rounded-full flex items-center justify-center mb-6">
        <svg class="h-8 w-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path>
        </svg>
      </div>
      <h2 class="text-3xl font-bold text-gray-900 mb-2">
        <span class="text-primary">med</span>speech.io
      </h2>
      <p class="text-gray-600">Your medical voice transcription assistant</p>
    </div>

    <div class="card p-8">
      <div class="flex justify-center" #googleButton></div>

      @if (isLoading) {
        <p class="mt-4 text-center text-sm text-gray-600">Signing you in...</p>
      }
      @if (errorMessage) {
        <p class="mt-4 text-center text-sm text-red-600">{{ errorMessage }}</p>
      }

      <div class="mt-6 text-center">
        <p class="text-xs text-gray-500">
          By continuing, you agree to our Terms of Service and Privacy Policy
        </p>
      </div>
    </div>
  </div>
</div>
