<div
  class="min-h-screen bg-gradient-to-br from-medical-50 to-blue-50 flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
  <div class="max-w-md w-full">
    <div class="card p-8 text-center">
      <!-- Loading State -->
      @if (isLoading) {
        <div class="mx-auto h-16 w-16 bg-medical-100 rounded-full flex items-center justify-center mb-6">
          <svg class="animate-spin h-8 w-8 text-medical-600" xmlns="http://www.w3.org/2000/svg" fill="none"
               viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor"
                  d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
        </div>
        <h3 class="text-lg font-semibold text-gray-900 mb-2">Verifying Your Access</h3>
        <p class="text-gray-600">Please wait while we verify your login link...</p>
      }


      <!-- Error State -->
      @if (!isLoading && errorMessage) {
        <div class="mx-auto h-16 w-16 bg-red-100 rounded-full flex items-center justify-center mb-6">
          <svg class="h-8 w-8 text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
          </svg>
        </div>
        <h3 class="text-lg font-semibold text-gray-900 mb-2">Verification Failed</h3>
        <p class="text-gray-600 mb-6">{{ errorMessage }}</p>
        <button (click)="goToLogin()" class="btn-primary">
          Back to Login
        </button>
      }
    </div>
  </div>
</div>
