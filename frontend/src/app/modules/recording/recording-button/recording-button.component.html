<div class="recording-button-container">
  @if (isRecording) {
    <div class="absolute inset-0 flex items-center justify-center">
      <div class="absolute w-32 h-32 rounded-full border-2 border-blue-400 opacity-70 wave-1"
           [style.boxShadow]="'0 0 8px rgba(59, 130, 246, 0.4)'"></div>
      <div class="absolute w-40 h-40 rounded-full border-blue-400 opacity-50 wave-2"
           [style.borderWidth]="'3px'"
           [style.boxShadow]="'0 0 8px rgba(59, 130, 246, 0.3)'"></div>
      <div class="absolute w-48 h-48 rounded-full border-blue-400 opacity-30 wave-3"
           [style.borderWidth]="'4px'"
           [style.boxShadow]="'0 0 8px rgba(59, 130, 246, 0.2)'"></div>
      <div class="absolute w-36 h-36 rounded-full bg-blue-400 opacity-10 blur-md glow"></div>
    </div>
  }

  <!-- Main recording button -->
  <button (click)="handleClick()"
          [disabled]="disabled"
          [class]="getButtonClasses()"
          [attr.aria-label]="getAriaLabel()">
    <div class="record-icon"></div>
  </button>
</div>
