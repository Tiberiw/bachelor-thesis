<div class="recording-button-container">
  @if (isRecording) {
    <!-- Rings react to the microphone: inner = low voice band, middle = mid, outer = high; glow = loudness. -->
    <div class="levels" aria-hidden="true">
      <div class="glow"></div>
      <div class="ring ring-low"></div>
      <div class="ring ring-mid"></div>
      <div class="ring ring-high"></div>
    </div>
  }

  <!-- Main recording button -->
  <button (click)="handleClick()"
          [disabled]="disabled"
          [class]="getButtonClasses()"
          [attr.aria-label]="getAriaLabel()">
    <div [class]="isRecording ? 'stop-icon' : 'record-icon'"></div>
  </button>
</div>
